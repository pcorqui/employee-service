server:
  port: 8080

spring:
  application:
    name: employee-service
  datasource:
    url: jdbc:h2:mem:employeedb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true

  # Seguridad básica por defecto (DevSecOps)
  security:
    user:
      name: admin
      password: ${ADMIN_PASSWORD:Admin123!}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.empresa.employee: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

jwt:
  secret: ${JWT_SECRET:MiClaveSecretaSuperSeguraParaEmpleados2026!}
  expiration: 3600000

